[flake8]
max-line-length = 100
# `amazing/` holds the externally assigned A-Maze-ing package. Subject V.4
# forbids modifying it ("You must use their package as-is"), so it is
# excluded from our own coding-standard checks.
exclude = .venv,venv,__pycache__,.mypy_cache,build,dist,amazing

[mypy]
# Same reasoning as the flake8 exclude above: the assigned A-Maze-ing
# package is third-party code we are not allowed to touch, so it must not
# make our own `make lint` fail.
exclude = (?x)(^amazing/|^build/|^dist/)
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-amazing.*]
ignore_errors = True
follow_imports = skip

[mypy-mazegen.*]
ignore_errors = True
follow_imports = skip

[mypy-pygame.*]
ignore_missing_imports = True
